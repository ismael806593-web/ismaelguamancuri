      // ==================== MODAL DE AUTOEVALUACIÓN INTERACTIVA ====================
      function QuizModal({ isOpen, onClose }) {
        const [currentIdx, setCurrentIdx] = useState(0);
        const [selectedOption, setSelectedOption] = useState(null);
        const [score, setScore] = useState(0);
        const [finished, setFinished] = useState(false);

        if (!isOpen) return null;

        const currentQ = quizQuestions[currentIdx];

        const handleSelect = (idx) => {
          if (selectedOption !== null) return;
          setSelectedOption(idx);
          if (idx === currentQ.correctIndex) {
            setScore(score + 1);
          }
        };

        const handleNext = () => {
          if (currentIdx + 1 < quizQuestions.length) {
            setCurrentIdx(currentIdx + 1);
            setSelectedOption(null);
          } else {
            setFinished(true);
          }
        };

        const handleReset = () => {
          setCurrentIdx(0);
          setSelectedOption(null);
          setScore(0);
          setFinished(false);
        };

        return (
          <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm" onClick={onClose}>
            <div 
              className="animate-modal bg-white rounded-3xl max-w-xl w-full p-6 sm:p-8 shadow-2xl border border-slate-200"
              onClick={(e) => e.stopPropagation()}
            >
              <div className="flex items-center justify-between pb-4 border-b border-slate-100 mb-6">
                <div className="flex items-center gap-2.5">
                  <span className="text-2xl">🎯</span>
                  <div>
                    <h3 className="text-lg font-bold font-display text-slate-900">Autoevaluación Rápida TIC</h3>
                    <p className="text-xs text-slate-500">Comprueba tu dominio de las 4 unidades</p>
                  </div>
                </div>
                <button onClick={onClose} className="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold">
                  ✕
                </button>
              </div>

              {!finished ? (
                <div className="space-y-5">
                  <div className="flex justify-between text-xs font-semibold text-slate-500">
                    <span>Pregunta {currentIdx + 1} de {quizQuestions.length}</span>
                    <span>Aciertos: {score}</span>
                  </div>

                  <p className="text-base font-semibold text-slate-900 leading-snug">
                    {currentQ.question}
                  </p>

                  <div className="space-y-2.5">
                    {currentQ.options.map((opt, idx) => {
                      let btnStyle = "bg-slate-50 border-slate-200 text-slate-700 hover:bg-slate-100";
                      if (selectedOption !== null) {
                        if (idx === currentQ.correctIndex) {
                          btnStyle = "bg-emerald-50 border-emerald-500 text-emerald-900 font-semibold";
                        } else if (idx === selectedOption) {
                          btnStyle = "bg-rose-50 border-rose-500 text-rose-900";
                        } else {
                          btnStyle = "bg-slate-50 border-slate-200 text-slate-400";
                        }
                      }

                      return (
                        <button
                          key={idx}
                          onClick={() => handleSelect(idx)}
                          className={`w-full text-left p-3.5 rounded-xl border text-sm transition-all ${btnStyle}`}
                        >
                          {opt}
                        </button>
                      );
                    })}
                  </div>

                  {selectedOption !== null && (
                    <div className="p-4 rounded-xl bg-blue-50 border border-blue-100 text-xs text-blue-900 leading-relaxed animate-fade-in">
                      <strong>Retroalimentación:</strong> {currentQ.explanation}
                    </div>
                  )}

                  <div className="pt-2 flex justify-end">
                    <button
                      disabled={selectedOption === null}
                      onClick={handleNext}
                      className={`px-5 py-2.5 rounded-xl text-sm font-semibold transition-all ${
                        selectedOption !== null 
                          ? 'bg-blue-600 hover:bg-blue-700 text-white shadow-sm' 
                          : 'bg-slate-100 text-slate-400 cursor-not-allowed'
                      }`}
                    >
                      {currentIdx + 1 < quizQuestions.length ? "Siguiente Pregunta →" : "Ver Resultados"}
                    </button>
                  </div>
                </div>
              ) : (
                <div className="text-center py-6 space-y-5 animate-fade-in">
                  <div className="w-20 h-20 rounded-full bg-blue-50 text-blue-600 flex items-center justify-center text-4xl mx-auto shadow-inner">
                    {score >= 4 ? "🏆" : score >= 3 ? "👏" : "📚"}
                  </div>
                  <div>
                    <h4 className="text-2xl font-extrabold font-display text-slate-900">
                      Obtuviste {score} de {quizQuestions.length} puntos
                    </h4>
                    <p className="text-sm text-slate-600 mt-2">
                      {score >= 4 
                        ? "¡Excelente dominio de los contenidos del Plan Analítico TIC!" 
                        : "Buen intento. Te recomendamos repasar las tarjetas de Estudio Profundo de cada unidad."}
                    </p>
                  </div>
                  <div className="flex justify-center gap-3 pt-2">
                    <button
                      onClick={handleReset}
                      className="px-5 py-2.5 rounded-xl text-sm font-semibold bg-blue-600 hover:bg-blue-700 text-white"
                    >
                      Reintentar Quiz
                    </button>
                    <button
                      onClick={onClose}
                      className="px-5 py-2.5 rounded-xl text-sm font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700"
                    >
                      Volver al Estudio
                    </button>
                  </div>
                </div>
              )}
            </div>
          </div>
        );
      }

      // ==================== COMPONENTE PRINCIPAL APP ====================
      function App() {
        const [activeUnit, setActiveUnit] = useState(null);
        const [searchQuery, setSearchQuery] = useState("");
        const [selectedTopic, setSelectedTopic] = useState(null);
        const [quizOpen, setQuizOpen] = useState(false);
        const [completedTopics, setCompletedTopics] = useState(() => {
          try {
            const saved = localStorage.getItem("tic_plan_completed_v1");
            return saved ? JSON.parse(saved) : [];
          } catch {
            return [];
          }
        });

        useEffect(() => {
          try {
            localStorage.setItem("tic_plan_completed_v1", JSON.stringify(completedTopics));
          } catch {}
        }, [completedTopics]);

        useEffect(() => {
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }, [activeUnit]);

        const toggleCompleteTopic = (topicId) => {
          setCompletedTopics((prev) =>
            prev.includes(topicId) ? prev.filter((id) => id !== topicId) : [...prev, topicId]
          );
        };

        const allTopicsFlat = useMemo(() => {
          return units.flatMap((u) =>
            u.themes.flatMap((th) =>
              th.topics.map((tp) => ({
                ...tp,
                unitNumber: u.number,
                unitTitle: u.title,
                themeTitle: th.title
              }))
            )
          );
        }, []);

        const filteredTopics = useMemo(() => {
          const q = searchQuery.trim().toLowerCase();
          if (!q) return [];
          return allTopicsFlat.filter(
            (t) =>
              t.title.toLowerCase().includes(q) ||
              t.definition.toLowerCase().includes(q) ||
              (t.keywords && t.keywords.some((k) => k.toLowerCase().includes(q)))
          );
        }, [searchQuery, allTopicsFlat]);

        const selectedUnitData = units.find((u) => u.id === activeUnit);

        return (
          <div className="min-h-screen flex flex-col bg-slate-50 text-slate-900">
            <Header 
              activeUnit={activeUnit} 
              setActiveUnit={setActiveUnit}
              searchQuery={searchQuery}
              setSearchQuery={setSearchQuery}
              onOpenQuiz={() => setQuizOpen(true)}
              completedCount={completedTopics.length}
              totalTopics={allTopicsFlat.length}
            />

            <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-10">
              {/* VISTA DE RESULTADOS DE BÚSQUEDA */}
              {searchQuery.trim() !== "" ? (
                <div className="animate-fade-in space-y-6">
                  <div className="flex flex-wrap items-center justify-between gap-4 bg-white p-6 rounded-2xl border border-slate-200">
                    <div>
                      <span className="text-xs font-bold uppercase tracking-wider text-blue-600">Búsqueda en Tiempo Real</span>
                      <h2 className="text-xl sm:text-2xl font-bold font-display text-slate-900">
                        Resultados para "{searchQuery}" ({filteredTopics.length})
                      </h2>
                    </div>
                    <button
                      onClick={() => setSearchQuery("")}
                      className="px-4 py-2 rounded-xl text-sm font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700"
                    >
                      Limpiar filtro
                    </button>
                  </div>

                  {filteredTopics.length > 0 ? (
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                      {filteredTopics.map((topic) => (
                        <TopicItem
                          key={topic.id}
                          topic={topic}
                          unitBadge={`Unidad ${topic.unitNumber}`}
                          isCompleted={completedTopics.includes(topic.id)}
                          onToggleComplete={toggleCompleteTopic}
                          onOpenDetail={setSelectedTopic}
                        />
                      ))}
                    </div>
                  ) : (
                    <div className="text-center py-16 bg-white rounded-3xl border border-slate-200">
                      <span className="text-4xl">🔎</span>
                      <h3 className="text-lg font-bold text-slate-800 mt-3">No se encontraron temas coincidentes</h3>
                      <p className="text-sm text-slate-500 mt-1">Intenta buscar términos como "ensayo", "paralingüística", "Scopus", "APA" o "Gemini".</p>
                    </div>
                  )}
                </div>
              ) : activeUnit === null ? (
                /* VISTA PRINCIPAL DEL PLAN ANALÍTICO */
                <div className="animate-fade-in space-y-10">
                  <div className="text-center max-w-3xl mx-auto pt-4 pb-2">
                    <span className="px-4 py-1.5 rounded-full text-xs font-bold bg-blue-50 text-blue-600 border border-blue-100 uppercase tracking-wider">
                      Tecnologías de la Información y Comunicación - TIC
                    </span>
                    <h2 className="text-3xl sm:text-5xl font-extrabold font-display text-slate-900 mt-4 mb-5 tracking-tight">
                      Plan Analítico de la Materia
                    </h2>
                    <p className="text-base sm:text-lg text-slate-600 leading-relaxed">
                      Explora las 4 unidades curriculares, profundiza en cada contenido mínimo con ejemplos prácticos, controla tu progreso de estudio y valida tus conocimientos.
                    </p>

                    {/* Tarjeta resumen de progreso */}
                    <div className="mt-8 inline-flex flex-wrap items-center justify-center gap-4 bg-white px-6 py-3.5 rounded-2xl border border-slate-200 shadow-sm">
                      <div className="text-left">
                        <span className="block text-[11px] font-bold uppercase text-slate-400">Tu Progreso Total</span>
                        <span className="text-sm font-bold text-slate-800">
                          {completedTopics.length} de {allTopicsFlat.length} temas completados ({Math.round((completedTopics.length / allTopicsFlat.length) * 100)}%)
                        </span>
                      </div>
                      <button
                        onClick={() => setQuizOpen(true)}
                        className="px-4 py-2 rounded-xl text-xs font-bold bg-blue-600 hover:bg-blue-700 text-white transition-colors"
                      >
                        🎯 Practicar Quiz
                      </button>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-7">
                    {units.map((unit) => (
                      <UnitCard 
                        key={unit.id} 
                        unit={unit} 
                        completedTopics={completedTopics}
                        onSelect={() => setActiveUnit(unit.id)} 
                      />
                    ))}
                  </div>
                </div>
              ) : (
                /* VISTA DETALLADA DE UNA UNIDAD */
                <div className="animate-fade-in space-y-10">
                  <div className="bg-white rounded-3xl p-7 sm:p-10 border border-slate-200 shadow-sm relative overflow-hidden">
                    <div className="absolute top-0 right-0 w-64 h-64 bg-slate-100/70 rounded-bl-full pointer-events-none" />
                    
                    <button 
                      onClick={() => setActiveUnit(null)}
                      className={`inline-flex items-center text-sm font-semibold ${selectedUnitData.accentText} hover:underline mb-6`}
                    >
                      &larr; Volver al plan analítico principal
                    </button>

                    <div className="flex flex-wrap items-center gap-3 mb-4">
                      <span className="w-12 h-12 rounded-2xl bg-slate-100 flex items-center justify-center text-2xl shadow-inner">
                        {selectedUnitData.icon}
                      </span>
                      <span className={`px-3.5 py-1 rounded-full text-xs font-bold border ${selectedUnitData.badgeClass}`}>
                        Unidad Curricular {selectedUnitData.number}
                      </span>
                    </div>

                    <h2 className="text-2xl sm:text-4xl font-extrabold font-display text-slate-900 mb-3">
                      {selectedUnitData.title}
                    </h2>
                    <p className="text-base sm:text-lg text-slate-600 max-w-3xl leading-relaxed">
                      {selectedUnitData.description}
                    </p>
                  </div>

                  <div className="space-y-14">
                    {selectedUnitData.themes.map((theme) => (
                      <section key={theme.id} className="space-y-6">
                        <div className="border-b border-slate-200 pb-4">
                          <h3 className="text-xl sm:text-2xl font-bold font-display text-slate-900">
                            {theme.title}
                          </h3>
                          {theme.subtitle && (
                            <p className="text-sm text-slate-500 mt-1">{theme.subtitle}</p>
                          )}
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                          {theme.topics.map((topic) => (
                            <TopicItem 
                              key={topic.id} 
                              topic={topic}
                              isCompleted={completedTopics.includes(topic.id)}
                              onToggleComplete={toggleCompleteTopic}
                              onOpenDetail={setSelectedTopic}
                            />
                          ))}
                        </div>
                      </section>
                    ))}
                  </div>
                </div>
              )}
            </main>

            {/* Modales interactivos */}
            <TopicDetailModal
              topic={selectedTopic}
              onClose={() => setSelectedTopic(null)}
              isCompleted={selectedTopic ? completedTopics.includes(selectedTopic.id) : false}
              onToggleComplete={toggleCompleteTopic}
            />

            <QuizModal
              isOpen={quizOpen}
              onClose={() => setQuizOpen(false)}
            />

            <footer className="bg-white border-t border-slate-200 mt-16 py-8">
