          themes: [
            {
              id: "unit4-theme1",
              title: "Temática 1: Procesador de textos. Hoja de cálculo.",
              topics: [
                { 
                  id: "u4-procesadores", 
                  title: "Procesadores de Texto", 
                  definition: "Los procesadores de texto son aplicaciones ofimáticas avanzadas concebidas para la creación, edición, formato y estructuración de documentos formales e informes de investigación bajo normativas internacionales como APA o Vancouver. Permiten la automatización de índices, tablas de contenido, referencias bibliográficas y revisión ortográfica colaborativa.", 
                  imageUrl: "https://images.unsplash.com/photo-1517694712202-14dd9538aa97?w=800&q=80", 
                  youtubeUrl: "http://www.youtube.com/watch?v=cR6mwPVJrtg", 
                  externalUrl: "https://es.wikipedia.org/wiki/Procesador_de_textos" 
                }
              ]
            },
            {
              id: "unit4-theme2",
              title: "Temática 2: Herramientas de IA generativa.",
              topics: [
                { 
                  id: "u4-usos-presentaciones", 
                  title: "Usos de las Presentaciones", 
                  definition: "Las presentaciones multimedia se emplean como recursos de apoyo visual estructurado para sintetizar información clave, retener la atención del auditorio y guiar el hilo conductor de una exposición oral profesional, evitando la saturación de texto plano en las diapositivas.", 
                  imageUrl: "https://images.unsplash.com/photo-1531482615713-2afd69097998?w=800&q=80", 
                  youtubeUrl: "http://www.youtube.com/watch?v=cNU5NEcrzsw", 
                  externalUrl: "https://concepto.de/diapositiva/" 
                },
                { 
                  id: "u4-powerpoint-prezi-canva", 
                  title: "PowerPoint, Prezi y Canva", 
                  definition: "PowerPoint, Prezi y Canva representan plataformas de diseño y presentación líderes en el entorno digital, ofreciendo plantillas dinámicas, transiciones espaciales y recursos gráficos de alto impacto visual para comunicar proyectos corporativos y académicos con máxima eficiencia.", 
                  imageUrl: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=800&q=80", 
                  youtubeUrl: "http://www.youtube.com/watch?v=xXvL5RwU1sw", 
                  externalUrl: "https://prezi.com/p/xbqhdlsrr_ws/herramientas-de-presentacion-prezi-canva-powtoon-y-genially/" 
                },
                { 
                  id: "u4-colaborativo", 
                  title: "Trabajo Colaborativo", 
                  definition: "El trabajo colaborativo mediado por tecnologías en la nube posibilita la coedición síncrona y asíncrona de documentos, hojas de cálculo y presentaciones entre múltiples usuarios distribuidos geográficamente, optimizando los flujos de trabajo en equipos académicos y empresariales.", 
                  imageUrl: "https://images.unsplash.com/photo-1522202176988-66273c2fd55f?w=800&q=80", 
                  youtubeUrl: "http://www.youtube.com/watch?v=Tnj4HpI6LqU", 
                  externalUrl: "https://es.wikipedia.org/wiki/Trabajo_colaborativo" 
                },
                { 
                  id: "u4-copilot", 
                  title: "Microsoft Copilot", 
                  definition: "Microsoft Copilot es un asistente inteligente basado en Inteligencia Artificial Generativa e integrado en el ecosistema digital, diseñado para potenciar la productividad mediante la generación automatizada de textos, síntesis de datos, asistencia en investigación y redacción documental avanzada.", 
                  imageUrl: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=800&q=80", 
                  youtubeUrl: "http://www.youtube.com/watch?v=S5wffL3L2K8", 
                  externalUrl: "https://es.wikipedia.org/wiki/Inteligencia_artificial_generativa" 
                }
              ]
            }
          ]
        }
      ];

      // ==================== COMPONENTES DE LA APP ====================
      function Header({ activeUnit, setActiveUnit }) {
        return (
          <header className="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-slate-200 shadow-sm">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
              <div className="flex items-center space-x-3 cursor-pointer" onClick={() => setActiveUnit(null)}>
                <div className="w-12 h-12 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center text-white text-2xl shadow-lg shadow-blue-500/20">
                  📊
                </div>
                <div>
                  <span className="text-xs font-semibold tracking-wider uppercase text-blue-600">Tecnologías de la Información y Comunicación - TIC</span>
                  <h1 className="text-lg sm:text-xl font-bold font-display text-slate-900 leading-tight">Plan Analítico</h1>
                </div>
              </div>

              <nav className="hidden md:flex items-center space-x-2">
                <button 
                  onClick={() => setActiveUnit(null)}
                  className={`px-4 py-2 rounded-xl text-sm font-medium transition-all ${activeUnit === null ? 'bg-blue-50 text-blue-600 font-semibold shadow-sm' : 'text-slate-600 hover:bg-slate-100'}`}
                >
                  Inicio / Plan Analítico
                </button>
                {units.map((u) => (
                  <button
                    key={u.id}
                    onClick={() => setActiveUnit(u.id)}
                    className={`px-4 py-2 rounded-xl text-sm font-medium transition-all ${activeUnit === u.id ? 'bg-blue-600 text-white shadow-md shadow-blue-600/20' : 'text-slate-600 hover:bg-slate-100'}`}
                  >
                    Unidad {u.number}
                  </button>
                ))}
              </nav>
            </div>
          </header>
        );
      }

      function UnitCard({ unit, onSelect }) {
        return (
          <div 
            onClick={onSelect}
            className="topic-card bg-white rounded-3xl p-8 border border-slate-200 cursor-pointer flex flex-col justify-between relative overflow-hidden group"
          >
            <div className="absolute top-0 right-0 w-32 h-32 bg-gradient-to-br from-blue-500/10 to-indigo-500/0 rounded-bl-full transition-transform duration-500 group-hover:scale-110" />
            
            <div>
              <div className="flex items-center justify-between mb-6">
                <span className="w-14 h-14 rounded-2xl bg-slate-100 flex items-center justify-center text-3xl shadow-inner">
                  {unit.icon}
                </span>
                <span className="px-4 py-1.5 rounded-full text-xs font-bold bg-blue-50 text-blue-600 border border-blue-100">
                  Unidad {unit.number}
                </span>
              </div>
              
              <h3 className="text-xl sm:text-2xl font-bold font-display text-slate-900 mb-3 group-hover:text-blue-600 transition-colors">
                {unit.title}
              </h3>
              
              <p className="text-slate-600 text-sm leading-relaxed mb-6">
                {unit.description}
              </p>
            </div>

            <div className="pt-4 border-t border-slate-100 flex items-center justify-between">
              <span className="text-xs font-semibold text-slate-500 uppercase tracking-wider">
                {unit.themes.reduce((acc, t) => acc + t.topics.length, 0)} Temas en el plan analítico
              </span>
              <span className="inline-flex items-center text-sm font-semibold text-blue-600 group-hover:translate-x-1 transition-transform">
                Explorar unidad &rarr;
              </span>
            </div>
          </div>
        );
      }

      function TopicItem({ topic }) {
        return (
          <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm hover:shadow-md transition-all flex flex-col justify-between">
            <div className="relative h-48 overflow-hidden bg-slate-100">
              <img 
                src={topic.imageUrl} 
                alt={topic.title} 
                className="w-full h-full object-cover image-hover"
                loading="lazy"
              />
              <div className="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent flex items-end p-4">
                <h4 className="text-white font-bold font-display text-lg leading-snug drop-shadow-sm">
                  {topic.title}
                </h4>
              </div>
            </div>

            <div className="p-6 flex-1 flex flex-col justify-between">
              <p className="text-slate-600 text-sm leading-relaxed mb-6">
                {topic.definition}
              </p>

              <div className="flex items-center gap-3 pt-4 border-t border-slate-100">
                <a 
                  href={topic.youtubeUrl} 
                  target="_blank" 
                  rel="noopener noreferrer"
                  className="btn-youtube flex-1 bg-red-600 hover:bg-red-700 text-white px-4 py-2.5 rounded-xl text-xs font-semibold flex items-center justify-center gap-2 shadow-sm"
                >
                  <svg className="w-4 h-4 fill-current" viewBox="0 0 24 24">
                    <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
                  </svg>
                  Ver Video
                </a>

                <a 
                  href={topic.externalUrl} 
                  target="_blank" 
                  rel="noopener noreferrer"
                  className="px-4 py-2.5 rounded-xl text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700 transition-colors flex items-center justify-center"
                >
                  Referencia ↗
                </a>
              </div>
            </div>
          </div>
        );
      }

      function App() {
        const [activeUnit, setActiveUnit] = useState(null);

        useEffect(() => {
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }, [activeUnit]);

        const selectedUnitData = units.find(u => u.id === activeUnit);

        return (
          <div className="min-h-screen flex flex-col bg-slate-50 text-slate-900">
            <Header activeUnit={activeUnit} setActiveUnit={setActiveUnit}/>

            <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-10">
              {activeUnit === null ? (
                <div className="animate-fade-in space-y-12">
                  <div className="text-center max-w-3xl mx-auto py-8">
                    <span className="px-4 py-1.5 rounded-full text-xs font-bold bg-blue-50 text-blue-600 border border-blue-100 uppercase tracking-wider">
                      Tecnologías de la Información y Comunicación - TIC
                    </span>
                    <h2 className="text-3xl sm:text-5xl font-extrabold font-display text-slate-900 mt-4 mb-6">
                      Plan Analítico de la Materia
                    </h2>
                    <p className="text-base sm:text-lg text-slate-600 leading-relaxed">
                      Consulta los contenidos programáticos, descripciones académicas ampliadas y recursos bibliográficos interactivos para tu formación profesional.
                    </p>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                    {units.map((unit) => (
                      <UnitCard key={unit.id} unit={unit} onSelect={() => setActiveUnit(unit.id)} />
                    ))}
                  </div>
                </div>
              ) : (
                <div className="animate-fade-in space-y-12">
                  <div className="bg-white rounded-3xl p-8 sm:p-10 border border-slate-200 shadow-sm relative overflow-hidden">
                    <div className="absolute top-0 right-0 w-64 h-64 bg-blue-500/5 rounded-bl-full pointer-events-none" />
                    
                    <button 
                      onClick={() => setActiveUnit(null)}
                      className="inline-flex items-center text-sm font-semibold text-blue-600 hover:text-blue-700 mb-6 transition-colors"
                    >
                      &larr; Volver al plan analítico principal
                    </button>

                    <div className="flex items-center gap-4 mb-4">
                      <span className="w-12 h-12 rounded-2xl bg-blue-50 text-blue-600 flex items-center justify-center text-2xl shadow-inner">
                        {selectedUnitData.icon}
                      </span>
                      <span className="px-3.5 py-1 rounded-full text-xs font-bold bg-blue-50 text-blue-600 border border-blue-100">
                        Unidad {selectedUnitData.number}
                      </span>
                    </div>

                    <h2 className="text-2xl sm:text-4xl font-extrabold font-display text-slate-900 mb-4">
                      {selectedUnitData.title}
                    </h2>
                    <p className="text-base sm:text-lg text-slate-600 max-w-3xl leading-relaxed">
                      {selectedUnitData.description}
                    </p>
                  </div>

                  <div className="space-y-16">
                    {selectedUnitData.themes.map((theme) => (
                      <div key={theme.id} className="space-y-6">
                        <div className="border-b border-slate-200 pb-4">
                          <h3 className="text-xl sm:text-2xl font-bold font-display text-slate-900">
                            {theme.title}
                          </h3>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                          {theme.topics.map((topic) => (
                            <TopicItem key={topic.id} topic={topic} />
                          ))}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </main>

            <footer className="bg-white border-t border-slate-200 mt-20 py-8">
              <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-sm text-slate-500">
                <p>&copy; 2026 Tecnologías de la Información y Comunicación (TIC) - Plan Analítico. Todos los derechos reservados.</p>
              </div>
            </footer>
          </div>
        );
      }

      ReactDOM.render(<App />, document.getElementById('root'));
    </script>
  </body>
</html>
